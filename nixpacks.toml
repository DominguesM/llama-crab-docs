# nixpacks.toml
# https://nixpacks.com/docs/configuration/file
#
# This file is used when deploying from the `build` branch.
# The `build` branch contains only the prebuilt `.output` directory
# generated by the CI workflow — no install or build steps needed.

[phases.setup]
nixPkgs = ['bun']

[phases.install]
cmds = []

[phases.build]
cmds = []

[start]
cmd = 'bun run server/index.mjs'
